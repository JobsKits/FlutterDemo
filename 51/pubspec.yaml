name: flutter_tiyu_app
version: 1.0.0+131
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  #IOS风格的icon库 地址：pub.dev/packages/cupertino_icons
  cupertino_icons: ^1.0.6
  #网络请求库 地址：pub.dev/packages/dio
  dio: ^5.5.0+1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  #国际化 地址：pub.dev/packages/intl
  intl: ^0.19.0
  # intl: ^0.20.2
  #强大的微框架：包含状态管理、路由导航、国际化、网络请求 地址：pub.dev/packages/get
  get: ^4.6.6
  #屏幕适配 地址：pub.dev/packages/flutter_screenutil
  flutter_screenutil: ^5.9.3
  #一个好用的Banner组件 地址：pub.dev/packages/carousel_slider
  carousel_slider: ^5.0.0
  #配合Banner组件、PageView组件使用的指示器，有多种样式和动效 地址：pub.dev/packages/smooth_page_indicator
  smooth_page_indicator: ^1.2.0
  #跑马灯组件依赖库 地址：pub.dev/packages/fading_edge_scrollview
  fading_edge_scrollview: ^4.1.1
  #在flutter组件中加载html标签 地址：pub.dev/packages/flutter_widget_from_html
  flutter_widget_from_html: ^0.15.1
  #加载svg图片 地址：pub.dev/packages/flutter_svg
  flutter_svg: ^2.0.10+1
  #加载网页、H5 地址：pub.dev/packages/webview_flutter
  webview_flutter: ^4.8.0
  #存储配置信息到本地 地址：pub.dev/packages/shared_preferences
  shared_preferences: ^2.2.3
  #Json转换库 配合 json_serializable 一起使用 地址：pub.dev/packages/json_serializable，pub.dev/packages/json_annotation
  json_annotation: ^4.9.0
  # 网络图片缓存和懒加载  地址：https://pub.dev/packages/cached_network_image
  cached_network_image: ^3.4.0
  #Loading 地址：https://pub.dev/packages/flutter_easyloading
  flutter_easyloading: ^3.0.5
  #获取设备信息 地址：https://pub.dev/packages/device_info_plus
  device_info_plus: ^10.1.2
  #device_info_plus 4.0.0 删除androidId， 推荐使用android_id获取安卓唯一设备ID 地址：https://pub.dev/packages/android_id
  android_id: ^0.4.0
  #视频播放二次封装库 地址：https://pub.dev/packages/chewie
  chewie: ^1.8.3
  #视频播放基础库 地址：https://pub.dev/packages/video_player
  video_player: ^2.9.1
  oktoast: any
  # 手机区号选择器
  country_code_picker: ^3.0.0
  # 二维码生成
  qr_flutter: ^4.1.0
  # 权限检查
  permission_handler: ^11.3.1
  # 保存到相册
  image_gallery_saver_plus: ^3.0.5
  package_info_plus: ^8.0.2
  # 用于从图像库中选择图像并使用相机拍摄新照片。不需要考虑版本问题，内部已有处理 地址：https://pub.dev/packages/image_picker
  image_picker: ^1.1.2
  # 一个访问阿里云oss并且支持STS临时访问凭证访问OSS的flutter库，基本上涵盖阿里云oss sdk的所有功能 地址：https://pub.dev/packages/flutter_oss_aliyun
  flutter_oss_aliyun: ^6.4.2
  # 图片处理
  image: ^4.2.0
  # 亚马逊 S3 上传
  aws_s3_upload_lite: ^0.1.3
  # 大转盘 地址：https://pub.dev/packages/flutter_fortune_wheel
  flutter_fortune_wheel: ^1.3.1
  loading_indicator: ^3.1.1
  pointycastle: ^3.9.1
  captcha_plugin_flutter: ^1.1.7
  url_launcher: ^6.3.1
  dart_ping: ^9.0.1
  dart_ping_ios: ^4.0.2
  # 极光推送 https://www.engagelab.com/zh_CN
  flutter_plugin_engagelab: ^1.2.4
  openinstall_flutter_plugin: ^2.5.1
  dartx: ^1.2.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  share_plus: ^10.1.2
  bottom_picker: ^2.9.0
  retrofit: ^4.4.1
  connectivity_plus: ^6.1.0
  html: ^0.15.5
  vibration: ^2.0.0
  wakelock_plus: ^1.2.10
  flutter_inappwebview: ^6.1.5
  flutter_cupertino_date_picker_fork: ^1.0.7
  network_info_plus: ^6.1.3
  get_storage: ^2.1.1
  lottie: ^3.2.0
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  json_serializable: ^6.8.0
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.2
  htprotect:
    path: ./plugins/htprotect

flutter_launcher_icons:
